name: Sync MUNI assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-muni-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download published MUNI assets
        shell: bash
        env:
          BASE: https://espaco-muni.mateus-tavarescosta0.chatgpt.site
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          assets=(
            encontro-muni.jpg
            higgsfield-movement.webp
            higgsfield-nutrition.webp
            higgsfield-objects.webp
            marca-muni.png
            movimento-muni.jpg
            muni-digital.jpg
            muni-film-poster.jpg
            muni-scroll-film.mp4
            nutricao-editorial.jpg
            pattern-unit.png
            portal-comecar.jpg
            portal-conectar.jpg
            portal-mover.jpg
            portal-nutrir.jpg
            ritual-muni.jpg
          )
          for file in "${assets[@]}"; do
            echo "Downloading $file"
            curl --fail --location --retry 3 --silent --show-error "$BASE/assets/$file" --output "dist/assets/$file"
          done
          curl --fail --location --retry 3 --silent --show-error "$BASE/style.css" --output dist/style.css

      - name: Make asset references local
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          base = "https://espaco-muni.mateus-tavarescosta0.chatgpt.site/assets/"
          paths = list(Path("dist").rglob("*.html")) + [Path("dist/site.js"), Path("dist/film.js")]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace(base, "/assets/"), encoding="utf-8")
          PY

      - name: Validate JavaScript
        run: |
          node --check dist/site.js
          node --check dist/film.js

      - name: Commit downloaded assets
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Vendor published MUNI assets"
          git push
